name: Build HyperPulse Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release HyperPulse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperPulse-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Split ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperPulse-Split-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: ignore
